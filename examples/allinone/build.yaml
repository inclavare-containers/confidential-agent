schema: confidential-agent/v1
service:
  id: allinone-builder
  ports: []
  app_service: cai-allinone.service
  ssh: true
build:
  image_name: allinone
  runtime_contract: ./runtime-contract.json
  resize: 80G
  repos:
    - name: alinux-os
      baseurl: https://mirrors.aliyun.com/alinux/3/os/$basearch/
      gpgkey: https://mirrors.aliyun.com/alinux/3/RPM-GPG-KEY-ALINUX-3
    - name: alinux-updates
      baseurl: https://mirrors.aliyun.com/alinux/3/updates/$basearch/
      gpgkey: https://mirrors.aliyun.com/alinux/3/RPM-GPG-KEY-ALINUX-3
    - name: alinux-plus
      baseurl: https://mirrors.aliyun.com/alinux/3/plus/$basearch/
      gpgkey: https://mirrors.aliyun.com/alinux/3/RPM-GPG-KEY-ALINUX-3
    - name: alinux-module
      baseurl: https://mirrors.aliyun.com/alinux/3/module/$basearch/
      gpgkey: https://mirrors.aliyun.com/alinux/3/RPM-GPG-KEY-ALINUX-3
    - name: alinux-powertools
      baseurl: https://mirrors.aliyun.com/alinux/3/powertools/$basearch/
      gpgkey: https://mirrors.aliyun.com/alinux/3/RPM-GPG-KEY-ALINUX-3
  packages: [ca-certificates, curl, findutils, git, jq, libatomic, nodejs, npm, openssh-server, podman, procps-ng, python3.11, shadow-utils, tar, util-linux, xz]
  files:
    - source: ../../target/debug/cai-pep
      target: /usr/local/bin/cai-pep
      executable: true
    - source: ../cli-agents/files/tdx-remote-attestation.SKILL.md
      target: /opt/data/allinone/home/.agents/skills/tdx-remote-attestation/SKILL.md
    - source: ../cli-agents/files/tdx-remote-attestation.SKILL.md
      target: /opt/data/allinone/home/.claude/skills/tdx-remote-attestation/SKILL.md
    - source: ../cli-agents/files/tdx-remote-attestation.SKILL.md
      target: /opt/data/allinone/home/.qoder/skills/tdx-remote-attestation/SKILL.md
    - source: ../cli-agents/files/tdx-remote-attestation.SKILL.md
      target: /opt/data/allinone/home/.config/opencode/skills/tdx-remote-attestation/SKILL.md
    - source: ../cli-agents/files/tdx-remote-attestation.SKILL.md
      target: /opt/data/allinone/hermes/skills/tdx-remote-attestation/SKILL.md
    - source: ../openclaw/files/tdx-remote-attestation.SKILL.md
      target: /opt/data/allinone/home/.openclaw/skills/tdx-remote-attestation/SKILL.md
    - source: ../openclaw/files/install-cai-pep.sh
      target: /usr/local/libexec/confidential-agent/openclaw/install-cai-pep.sh
      executable: true
    - source: ../openclaw/files/cai-pep-default-policy.json
      target: /usr/local/share/confidential-agent/openclaw/cai-pep-default-policy.json
    - source: ../openclaw/files/cai-pep-plugin
      target: /usr/local/share/confidential-agent/openclaw/cai-pep-plugin
    - source: ../openclaw/files/cai-a2a-plugin
      target: /usr/local/share/confidential-agent/openclaw/cai-a2a-plugin
    - source: ../openclaw/files/patch-openclaw-cai-pep.js
      target: /usr/local/share/confidential-agent/openclaw/patch-openclaw-cai-pep.js
      executable: true
    - source: ../cli-agents/files/install-cli-agent-runtime.sh
      target: /usr/local/libexec/confidential-agent/cli-agent/install-cli-agent-runtime.sh
      executable: true
    - source: ../hermes-agent/files/install-hermes-agent-runtime.sh
      target: /usr/local/libexec/confidential-agent/hermes/install-hermes-agent-runtime.sh
      executable: true
    - source: ./files/cai-agent
      target: /usr/local/bin/cai-agent
      executable: true
    - source: ./files/finalize-runtime.py
      target: /usr/local/libexec/confidential-agent/allinone/finalize-runtime.py
    - source: ./files/cai-allinone.service
      target: /etc/systemd/system/cai-allinone.service
    - source: ./files/cai-ssh.service
      target: /etc/systemd/system/cai-ssh.service
    - source: ./files/cai-ssh.path
      target: /etc/systemd/system/cai-ssh.path
    - source: ./files/sshd_config
      target: /usr/local/libexec/confidential-agent/allinone/sshd_config
  scripts: [./install-allinone.sh]
deploy:
  provider: aliyun
  region: cn-beijing
  zone_id: cn-beijing-i
  instance_type: ecs.g9i.xlarge
  disk_gb: 80
attestation:
  tee: tdx
  mode: challenge
  reference_values: sample
resources: {}
