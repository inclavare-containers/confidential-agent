name: Binary packages

on:
  push:
    branches: [master, 'release/**']
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  mac-deploy-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the native deploy-only CLI and test tunnel ownership
        run: |
          cargo test --locked -p confidential-agent-cli --no-default-features --bin confidential-agent app::native_process::tests
          cargo build --locked --release -p confidential-agent-cli --no-default-features
          target/release/confidential-agent --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cagent-darwin-arm64
          path: target/release/confidential-agent
          if-no-files-found: error
      - name: Run one-click with a user-installed Python on Apple Silicon
        shell: /bin/bash {0}
        env:
          CA_GITHUB_PROXY_URL: ''
        run: |
          set -eu
          export XDG_DATA_HOME="$RUNNER_TEMP/one-click data"
          bin="$RUNNER_TEMP/without-python"
          mkdir "$bin"
          for cmd in uname curl shasum tar gzip mktemp mkdir mv rm; do
            ln -s "$(command -v "$cmd")" "$bin/$cmd"
          done
          export PATH="$bin"
          script=one-click/lib/python.sh
          executable="$(/bin/bash "$script" -c 'import platform, ssl, sys; assert platform.machine() == "arm64"; print(sys.executable)')"
          [[ "$executable" == "$XDG_DATA_HOME/"* ]]
          CA_SKIP_DEPS=1 /bin/bash "$script" -c 'import sys; assert sys.executable == sys.argv[1]' "$executable"

  checks:
    if: github.repository == 'inclavare-containers/confidential-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Check versions and scripts
        run: |
          python3.11 packaging/check-version.py
          for script in packaging/*.sh hack/*.sh one-click/lib/*.sh common/*.sh; do bash -n "$script"; done
          for script in one-click/install*.sh; do sh -n "$script"; done
          git diff --check
      - name: Test Rust workspace
        run: cargo test --locked --workspace
      - name: Test verified downloads and package upgrades
        run: |
          python3.11 -m unittest discover -s packaging/tests -v
      - name: Test one-click harness configuration
        run: |
          cargo build --locked -p confidential-agent-cli -p cai-pep
          for test in one-click/tests/*.sh; do bash "$test"; done
      - name: Fetch native tools for E2E tests
        env:
          CA_GITHUB_PROXY_FIRST: "0"
        run: packaging/fetch-native-tools.sh "$RUNNER_TEMP/cagent-tools"
      - name: Fetch the pinned OpenClaw test fixture
        run: |
          mkdir -p "$RUNNER_TEMP/openclaw-fixture"
          version="$(python3.11 -c 'import json; print(json.load(open("software-versions.json"))["openclaw"])')"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/openclaw-fixture" "openclaw@$version"
          tar -xzf "$RUNNER_TEMP/openclaw-fixture/openclaw-$version.tgz" -C "$RUNNER_TEMP/openclaw-fixture"
      - name: Test E2E orchestration
        run: |
          export CA_BIN="$PWD/target/debug/confidential-agent" CA_PEP_BIN="$PWD/target/debug/cai-pep" CA_TOOLS_DIR="$RUNNER_TEMP/cagent-tools"
          python3.11 -m unittest discover -s tools/e2e/tests -v
          for test in tools/e2e/tests/*.sh; do
            case "$test" in
              */debug-ssh-first-use.sh) sudo env "PATH=$PATH" bash "$test" ;;
              *) bash "$test" ;;
            esac
          done
          for test in tools/e2e/tests/*.mjs; do node "$test" "$RUNNER_TEMP/openclaw-fixture/package"; done

  rpm:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download verified companion Shelter package
        env:
          CA_GITHUB_PROXY_FIRST: "0"
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python3 hack/fetch-shelter-rpm.py
      - name: Build Alinux3 RPM and offline inputs
        run: packaging/ci-build.sh
      - name: Test installation in a fresh Alinux3 container
        run: packaging/ci-install-test.sh
      - name: Preserve tested release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-release
          path: target/release-dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.repository == 'inclavare-containers/confidential-agent' && startsWith(github.ref, 'refs/tags/v')
    needs: rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binary-release
          path: release-files
      - name: Publish the tested draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xOzf release-files/cagent-*-build-inputs.tar.gz SOURCES/cagent-native-tools.tar.gz | tar -xz native-tools/oras
          PATH="$PWD/native-tools:$PATH" python3 packaging/publish-release.py release-files
